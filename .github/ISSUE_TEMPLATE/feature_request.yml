name: Feature request / 功能建议
description: Propose a focused improvement with its use case.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Keep live deployment addresses, secrets and unpatched vulnerability details out of public requests. [Security policy](https://github.com/beezcheyenna/Proxy-Guard/blob/main/docs/SECURITY.en.md)
        请勿填写实际部署地址、密钥或未修复的漏洞细节。
  - type: textarea
    id: problem
    attributes:
      label: User problem / 使用场景与问题
      description: Include the installed Proxy Guard version, the affected workflow and the practical need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
      description: Describe defaults, scope, failure behavior and alternatives.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations / 兼容性考虑
      description: Would it change port scope, permissions, control protocols or existing configuration?
