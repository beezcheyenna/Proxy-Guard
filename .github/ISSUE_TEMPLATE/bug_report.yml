name: Non-security bug / 普通问题
description: Report an ordinary bug with redacted information. 此表单用于已脱敏的普通问题反馈。
title: '[Bug] '
body:
- type: markdown
  attributes:
    value: '**Public bug report / 公开问题反馈**


      Use this form for ordinary bugs. Keep unpatched vulnerability details, live deployment IPs
      and credentials out of public reports.


      这里用于反馈普通问题。请勿公开未修复的漏洞细节、实际部署 IP 或凭据。


      **日本語:** 未修正の脆弱性の詳細、認証情報、実際の運用環境の IP アドレスは公開しないでください。

      **Русский:** Не публикуйте подробности неисправленных уязвимостей, учётные данные и IP-адреса рабочих систем.

      **فارسی:** جزئیات آسیب‌پذیری‌های رفع‌نشده، اطلاعات احراز هویت و نشانی IP سامانه‌های عملیاتی را منتشر نکنید.


      This form creates a public issue in a public repository. Checking a box does not make it private.
      / 公开仓库中的此表单会生成公开 Issue，勾选确认不会让它变为私密。'
- type: checkboxes
  id: public-safety
  attributes:
    label: Public-reporting check / 公开反馈确认
    options:
    - label: This is a non-security issue with no credentials, real deployment IPs or exploitable details.
        / 这是普通问题，不含凭据、真实部署 IP 或可利用的漏洞细节。
      required: true
- type: input
  id: versions
  attributes:
    label: Component and versions / 组件与版本
    description: Installed Proxy Guard version. / 填写实际安装的 Proxy Guard 版本。
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment / 使用环境
    description: Firmware, kernel, architecture, proxy client and mode. Do not include
      live IPs or secrets. / 固件、内核、架构、代理客户端和模式；勿填真实 IP 或密钥。
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Steps, expected and actual behavior / 复现、预期与实际行为
    description: Use an authorized test environment. Describe network paths with documentation addresses.
      / 在获授权的测试环境复现，用文档地址描述路径。
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Optional redacted logs / 可选脱敏日志
    description: Minimal necessary excerpts only; no full production config, HAR, tokens, passwords or
      private keys. / 仅贴必要片段，不要提交完整生产配置、HAR、token、密码或私钥。
    render: text
  validations:
    required: false
